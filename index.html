<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>네페르 향 능력치</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Manrope:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3F8; --ink:#1A2230; --muted:#5A6B80; --line:#C9D6E4;
  --accent:#4A7BA6; --accent-strong:#27506E;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manrope",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:420px;margin:0 auto;padding:32px 24px 40px}
.brand{font-family:"Fraunces",serif;font-weight:500;letter-spacing:0.18em;font-size:20px;text-align:center;margin:0}
.sub{text-align:center;color:var(--muted);font-size:13px;letter-spacing:0.05em;margin:6px 0 28px}
svg{display:block;margin:0 auto}
.axis{font-family:"Manrope",sans-serif;font-size:13px;fill:var(--ink)}
.rows{margin:28px auto 0;display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:14px}
.row label{font-size:14px;color:var(--muted);min-width:48px}
.row output{font-size:14px;font-weight:500;min-width:28px;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:3px;background:var(--line);border-radius:2px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--bg)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--bg)}
.presets{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:26px}
.presets button{font-family:"Manrope",sans-serif;font-size:13px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 16px;cursor:pointer;transition:all .15s}
.presets button:hover{border-color:var(--accent);color:var(--accent-strong)}
</style>
</head>
<body>
<div class="wrap">
  <p class="brand">NEFER</p>
  <p class="sub">향 능력치</p>
  <svg viewBox="0 0 320 300" width="100%" style="max-width:300px" role="img" aria-label="가벼움 달콤함 시원함 세 축 능력치 그래프">
    <polygon points="40,60 280,60 160,250" fill="none" stroke="var(--line)" stroke-width="1"/>
    <line x1="160" y1="123.3" x2="40" y2="60" stroke="var(--line)" stroke-width="0.5"/>
    <line x1="160" y1="123.3" x2="280" y2="60" stroke="var(--line)" stroke-width="0.5"/>
    <line x1="160" y1="123.3" x2="160" y2="250" stroke="var(--line)" stroke-width="0.5"/>
    <polygon id="poly" points="" fill="#4A7BA6" fill-opacity="0.2" stroke="#27506E" stroke-width="2" stroke-linejoin="round"/>
    <circle id="d0" r="4" fill="#27506E"/>
    <circle id="d1" r="4" fill="#27506E"/>
    <circle id="d2" r="4" fill="#27506E"/>
    <text x="36" y="48" text-anchor="middle" class="axis">가벼움</text>
    <text x="284" y="48" text-anchor="middle" class="axis">달콤함</text>
    <text x="160" y="272" text-anchor="middle" class="axis">시원함</text>
  </svg>
  <div class="rows">
    <div class="row"><label>가벼움</label><input type="range" id="s-a" min="0" max="100" step="1" value="70"><output id="o-a">70</output></div>
    <div class="row"><label>달콤함</label><input type="range" id="s-b" min="0" max="100" step="1" value="40"><output id="o-b">40</output></div>
    <div class="row"><label>시원함</label><input type="range" id="s-c" min="0" max="100" step="1" value="55"><output id="o-c">55</output></div>
  </div>
  <div class="presets">
    <button data-preset="70,30,50">데일리</button>
    <button data-preset="45,75,35">데이트</button>
    <button data-preset="55,40,80">여행</button>
  </div>
</div>
<script>
(function(){
  var V=[[40,60],[280,60],[160,250]], C=[160,123.333], ids=['a','b','c'];
  function pt(i,v){return [C[0]+v*(V[i][0]-C[0]), C[1]+v*(V[i][1]-C[1])];}
  function update(){
    var vals=ids.map(function(id){return +document.getElementById('s-'+id).value;});
    vals.forEach(function(v,i){document.getElementById('o-'+ids[i]).textContent=Math.round(v);});
    var pts=vals.map(function(v,i){return pt(i,v/100);});
    document.getElementById('poly').setAttribute('points', pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' '));
    pts.forEach(function(p,i){var d=document.getElementById('d'+i);d.setAttribute('cx',p[0].toFixed(1));d.setAttribute('cy',p[1].toFixed(1));});
  }
  ids.forEach(function(id){document.getElementById('s-'+id).addEventListener('input',update);});
  document.querySelectorAll('[data-preset]').forEach(function(b){b.addEventListener('click',function(){var v=b.dataset.preset.split(',');document.getElementById('s-a').value=v[0];document.getElementById('s-b').value=v[1];document.getElementById('s-c').value=v[2];update();});});
  update();
})();
</script>
</body>
</html>
