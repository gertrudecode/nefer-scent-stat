<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>부천 공유오피스 비교</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root {
    --bg: #f6f7f9;
    --card-bg: #ffffff;
    --text: #1c1e21;
    --text-soft: #6b7280;
    --border: #e3e6ea;
    --accent: #2563eb;
    --accent-soft: #dbeafe;
    --good: #16a34a;
    --good-soft: #dcfce7;
    --muted: #c2c8cf;
    --warn: #b45309;
    --warn-soft: #fef3c7;
    --best-soft: #ecfdf5;
    --shadow: 0 1px 2px rgba(0,0,0,.04);
    --radius: 14px;
  }
  [data-theme="dark"] {
    --bg: #14161a;
    --card-bg: #1e2128;
    --text: #e8eaed;
    --text-soft: #9aa0a6;
    --border: #2c3038;
    --accent: #60a5fa;
    --accent-soft: #1e3a5f;
    --good: #4ade80;
    --good-soft: #14361f;
    --muted: #4a505a;
    --warn: #fbbf24;
    --warn-soft: #3a2e10;
    --best-soft: #10261c;
    --shadow: 0 1px 2px rgba(0,0,0,.3);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px 60px; }

  header.bar {
    position: sticky; top: 0; z-index: 1000;
    background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 14px 16px;
  }
  .bar-inner { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { font-size: 18px; margin: 0; font-weight: 700; }
  .sub { font-size: 12.5px; color: var(--text-soft); margin-top: 2px; }
  .theme-btn { border: 1px solid var(--border); background: transparent; color: var(--text);
    border-radius: 999px; padding: 7px 12px; font-size: 13px; cursor: pointer; white-space:nowrap; }
  .slider-block { display: flex; align-items: center; gap: 14px; }
  .slider-block label { font-size: 13px; font-weight: 600; white-space: nowrap; }
  .months-val { color: var(--accent); font-weight: 700; }
  input[type="range"] { flex: 1; -webkit-appearance: none; appearance: none; height: 6px;
    border-radius: 999px; background: var(--border); outline: none; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 26px; height: 26px;
    border-radius: 50%; background: var(--accent); cursor: pointer; border: 3px solid var(--card-bg); box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  input[type="range"]::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); cursor: pointer; border: 3px solid var(--card-bg); }

  #map { width: 100%; height: 230px; border-radius: var(--radius); margin-top: 18px; border: 1px solid var(--border); z-index: 1; background: var(--bg); }
  @media (min-width: 720px) { #map { height: 320px; } }
  .leaflet-container { font: inherit; }

  .grid { display: grid; grid-template-columns: minmax(0,1fr); gap: 16px; margin-top: 16px; align-items: stretch; }
  @media (min-width: 640px) { .grid { grid-template-columns: repeat(2, minmax(0,1fr)); } }
  @media (min-width: 1024px) { .grid { grid-template-columns: repeat(4, minmax(0,1fr)); } }

  .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; min-width: 0;
    scroll-margin-top: 190px; transition: border-color .15s, box-shadow .15s; }
  .card.highlight { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .card h2 { font-size: 15.5px; margin: 0; }
  .loc { font-size: 12px; color: var(--text-soft); margin-top:2px; }

  .badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600;
    padding: 4px 8px; border-radius: 999px; }
  .badge.on { background: var(--good-soft); color: var(--good); }
  .badge.off { background: transparent; color: var(--muted); border: 1px dashed var(--muted); }

  .cost-box { background: var(--bg); border-radius: 10px; padding: 12px; }
  .total { font-size: 23px; font-weight: 800; color: var(--accent); }
  .total small { font-size: 12.5px; font-weight: 600; color: var(--text-soft); }
  .cost-line { font-size: 12.5px; color: var(--text-soft); display:flex; justify-content:space-between; margin-top:4px; gap:8px; }
  .cost-line b { color: var(--text); font-weight:600; }
  .pill { font-size:11px; padding:2px 7px; border-radius:999px; background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .pill.warn { background:var(--warn-soft); color:var(--warn); }
  .edit-btn { margin-top:10px; width:100%; border:1px solid var(--accent); color:var(--accent);
    background:transparent; border-radius:8px; padding:7px; font-size:12.5px; font-weight:600; cursor:pointer; }
  .edit-btn:hover { background: var(--accent-soft); }
  .edit-area { display:none; margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); }
  .edit-area.open { display:block; }
  .edit-field { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:8px; font-size:12px; }
  .edit-field input { width: 92px; text-align:right; padding:5px 8px; border:1px solid var(--border);
    border-radius:8px; background:var(--card-bg); color:var(--text); font-size:13px; }
  .edit-note { font-size:11px; color:var(--text-soft); margin-top:8px; }
  .reset-btn { margin-top:10px; border:1px solid var(--border); background:transparent; color:var(--text-soft);
    border-radius:8px; padding:5px 10px; font-size:12px; cursor:pointer; }

  /* 갤러리 */
  .gallery { display:flex; flex-direction:column; gap:6px; min-width:0; }
  .gallery-thumbs { min-width:0; }
  .gallery-main { position:relative; width:100%; aspect-ratio:4/3; border-radius:10px; overflow:hidden;
    border:1px solid var(--border); cursor:pointer; background:var(--bg); }
  .gallery-main img { width:100%; height:100%; object-fit:cover; display:block; }
  .gallery-count { position:absolute; right:8px; bottom:8px; background:rgba(0,0,0,.62); color:#fff;
    font-size:11px; font-weight:600; padding:3px 8px; border-radius:999px; }
  .gallery-thumbs { display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; }
  .gallery-thumbs img { width:48px; height:38px; object-fit:cover; border-radius:6px; border:1px solid var(--border);
    cursor:pointer; flex:0 0 auto; opacity:.7; transition:opacity .12s; }
  .gallery-thumbs img:hover, .gallery-thumbs img.active { opacity:1; outline:2px solid var(--accent); }
  .gallery-empty { width:100%; aspect-ratio:4/3; border-radius:10px; border:1px dashed var(--border);
    display:flex; align-items:center; justify-content:center; color:var(--text-soft); font-size:12.5px; background:var(--bg); }

  /* 라이트박스 */
  .lb { position:fixed; inset:0; background:rgba(0,0,0,.9); z-index:3000; display:none;
    align-items:center; justify-content:center; flex-direction:column; padding:20px; }
  .lb.open { display:flex; }
  .lb img { max-width:92vw; max-height:78vh; object-fit:contain; border-radius:8px; }
  .lb-cap { color:#eee; font-size:13.5px; margin-top:14px; text-align:center; }
  .lb-close { position:absolute; top:16px; right:18px; color:#fff; font-size:30px; cursor:pointer; line-height:1;
    background:none; border:none; }
  .lb-nav { position:absolute; top:50%; transform:translateY(-50%); color:#fff; font-size:40px; cursor:pointer;
    background:none; border:none; padding:10px 16px; user-select:none; }
  .lb-prev { left:6px; } .lb-next { right:6px; }

  /* 제휴 혜택 */
  .partner { background:var(--good-soft); border-radius:10px; padding:10px 12px; }
  .partner .section-h { color:var(--good); }
  .partner ul { margin:5px 0 0; padding-left:16px; font-size:12px; }
  .partner ul li { margin-bottom:3px; }

  .section-h { font-size:11.5px; font-weight:700; color:var(--text-soft); letter-spacing:.03em; margin:2px 0 0; }
  ul.list { margin:4px 0 0; padding-left:15px; font-size:12.5px; }
  ul.list.pro li { margin-bottom:3px; }
  ul.list.con li { margin-bottom:3px; color: var(--text-soft); }

  /* 비교표 */
  .cmp-h { font-size:16px; font-weight:700; margin:34px 0 4px; }
  .cmp-sub { font-size:12.5px; color:var(--text-soft); margin-bottom:12px; }
  .table-scroll { overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); background:var(--card-bg); }
  table.cmp { border-collapse:collapse; width:100%; min-width:560px; font-size:13px; }
  table.cmp th, table.cmp td { padding:11px 12px; text-align:center; border-bottom:1px solid var(--border); }
  table.cmp thead th { background:var(--bg); font-size:12.5px; font-weight:700; position:sticky; top:0; }
  table.cmp th.feat, table.cmp td.feat { text-align:left; font-weight:600; white-space:nowrap;
    position:sticky; left:0; background:var(--card-bg); z-index:2; }
  table.cmp thead th.feat { background:var(--bg); z-index:3; }
  table.cmp tbody tr:last-child td { border-bottom:none; }
  .yes { color:var(--good); font-weight:700; }
  .no { color:var(--muted); }
  .val { color:var(--text); }
  .rate { display:inline-block; font-size:11px; font-weight:700; padding:2px 9px; border-radius:999px; }
  .rate.good { background:var(--good-soft); color:var(--good); }
  .rate.mid { background:transparent; color:var(--text-soft); border:1px solid var(--border); }
  .rate.bad { background:var(--warn-soft); color:var(--warn); }
  table.cmp td.vcell { vertical-align:top; }
  .best { background:var(--best-soft); }
  .cell-note { display:block; font-size:11px; color:var(--text-soft); margin-top:2px; }

  .foot { font-size:11.5px; color:var(--text-soft); margin-top:28px; line-height:1.6; }
  .foot b { color: var(--text); }
</style>
</head>

<header class="bar">

      <div>
        <h1>부천 공유오피스 비교 · 2인실</h1>

      </div>
      <button class="theme-btn" id="themeBtn">🌙 다크</button>
    </div>
    <div class="slider-block">
      <label>체류 기간 <span class="months-val" id="monthsLabel">6개월</span></label>

  <div class="table-scroll"><table class="cmp" id="prosTable"></table></div>

  <div class="cmp-h">편의시설 비교</div>
  <div class="cmp-sub">2인실 입주 기준으로 실제 차이가 나는 항목만 정리했습니다.</div>
  <div class="table-scroll"><table class="cmp" id="amenTable"></table></div>

  <div class="cmp-h">주차 비교</div>
  <div class="cmp-sub">시간당 환산 기준으로 가장 저렴한 곳을 강조했습니다.</div>
  <div class="table-scroll"><table class="cmp" id="parkTable"></table></div>

  <div class="foot" id="foot"></div>
</div>

<div class="lb" id="lightbox">
  <button class="lb-close" id="lbClose" aria-label="닫기">×</button>
  <button class="lb-nav lb-prev" id="lbPrev" aria-label="이전">‹</button>
  <img id="lbImg" src="" alt="" />
  <div class="lb-cap" id="lbCap"></div>
  <button class="lb-nav lb-next" id="lbNext" aria-label="다음">›</button>
</div>

/* ===================== 소프트코딩: 사용자 편집값 저장 ===================== */
const LS_KEY = "bucheon_office_overrides_v2";
let overrides = {};
try { overrides = JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch(e) { overrides = {}; }
function saveOverrides() { try { localStorage.setItem(LS_KEY, JSON.stringify(overrides)); } catch(e){} }
function ov(id) { return (overrides[id] = overrides[id] || {}); }

let months = 6;
const ROOM = "2인";

/* ===================== 계산 로직 ===================== */
function fmt(만) {
  if (만 == null || isNaN(만)) return "—";
  return Math.round(만).toLocaleString("ko-KR") + "만원";
}

function compute(o) {
  const m = Math.max(months, 1);
  const p = o.pricing;
  const userOv = ov(o.id);

  if (p.type === "flatMonthlyWithTermDiscount") {
    const base = (userOv.monthly && userOv.monthly[ROOM] != null) ? userOv.monthly[ROOM] : p.monthly[ROOM];
    let eff = Math.max(m, p.minMonths);
    let total = base * eff, discounted=false, freeMonth=false;
    if (eff >= p.discountFromMonth) { total *= (1 - p.discountRate); discounted=true; }
    if (eff >= p.freeMonthFrom) { total -= base; freeMonth=true; }
    const dep = p.deposit[ROOM];
    const deposit = (eff <= p.minMonths) ? dep.short : dep.long;
    return { ok:true, total, monthly: total/eff, baseMonthly: base, deposit, effMonths: eff,
      minApplied: m < p.minMonths, notes:[discounted?"총액 10% 할인":null, freeMonth?"1개월 무료":null].filter(Boolean),
      depositLabel:"예치금(환급)" };
  }
  if (p.type === "tieredMonthlyByTerm") {
    const defs = p.tiers[ROOM];
    const tiers = (userOv.tiers && userOv.tiers[ROOM]) ? userOv.tiers[ROOM] : defs.map(t=>t.monthly);
    let idx = defs.findIndex(t => m <= t.maxMonths); if (idx<0) idx = defs.length-1;
    const monthly = tiers[idx];
    return { ok:true, total: monthly*m, monthly, baseMonthly: monthly, deposit:null, effMonths:m,
      notes:[], depositLabel:"보증금", depositWarn:true };
  }
  if (p.type === "userInput") {
    const input = (userOv.monthlyInput != null) ? userOv.monthlyInput : p.monthlyInput;
    if (input == null || input === "" || isNaN(input)) return { ok:false, reason:"월 단가 미입력 (문의 필요)" };
    return { ok:true, total: input*m, monthly: input, baseMonthly: input, deposit:0, effMonths:m,
      notes:["보증금·관리비 없음"], depositLabel:"보증금" };
  }
}

  }
  const noteTags = r.notes.map(n=>`<span class="pill">${n}</span>`).join(" ");
  const depLine = r.deposit != null
    ? `<div class="cost-line"><span>${r.depositLabel}</span><b>${fmt(r.deposit)}</b></div>`
    : `<div class="cost-line"><span>보증금</span><span class="pill warn">확인 필요</span></div>`;
  return `
    <div class="total">${fmt(r.total)} <small>/ ${r.effMonths}개월</small></div>
    <div class="cost-line"><span>적용 월 단가</span><b>${fmt(r.monthly)}/월</b></div>
    ${r.baseMonthly!==r.monthly ? `<div class="cost-line"><span>정가 월 단가</span><b>${fmt(r.baseMonthly)}/월</b></div>`:""}

function attachCardEvents() {
  document.querySelectorAll(".card").forEach(c => {
    c.addEventListener("click", (e) => {
      if (e.target.closest("input,button,.edit-area,.gallery")) return;
      const o = offices.find(x=>x.id===c.dataset.id);
      if (map && o) { map.setView([o.lat,o.lng], 16); markers[o.id].openPopup(); }
      highlightCard(o.id);
    });
  });
  // 큰 사진 클릭 → 라이트박스
  document.querySelectorAll(".gallery-main").forEach(el => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      openLightbox(el.dataset.gid, parseInt(el.dataset.gidx) || 0);
    });
  });
  // 작은 사진 클릭 → 큰 사진 교체
  document.querySelectorAll(".gallery-thumbs img").forEach(t => {
    t.addEventListener("click", (e) => {
      e.stopPropagation();
      const gid = t.dataset.gid, idx = parseInt(t.dataset.tidx) || 0;
      const o = offices.find(x=>x.id===gid);
      const main = document.querySelector(`.gallery-main[data-gid="${gid}"]`);
      if (!o || !main) return;
      const mainImg = main.querySelector("img");
      mainImg.src = o.images[idx].src; mainImg.alt = o.images[idx].caption;
      main.dataset.gidx = idx;
      const wrap = t.closest(".gallery");
      wrap.querySelectorAll(".gallery-thumbs img").forEach(im=>im.classList.remove("active"));
      t.classList.add("active");
    });
  });
  document.querySelectorAll("button[data-edit]").forEach(b=>{
    b.addEventListener("click", ()=> {
      const a = document.getElementById("edit-"+b.dataset.edit);
      const open = a.classList.toggle("open");
      b.textContent = open ? "닫기" : "비용 수정";
    });
  });
  document.querySelectorAll('input[type="number"][data-f]').forEach(inp => {
    inp.addEventListener("input", () => {
      const id = inp.dataset.id, f = inp.dataset.f;
      const val = inp.value === "" ? null : parseFloat(inp.value);
      const u = ov(id);
      if (f === "m2") { u.monthly = u.monthly || {}; u.monthly["2인"] = val; }
      else if (f[0]==="t") {
        const office = offices.find(x=>x.id===id);
        u.tiers = u.tiers || {}; u.tiers["2인"] = u.tiers["2인"] || office.pricing.tiers["2인"].map(x=>x.monthly);
        u.tiers["2인"][parseInt(f[1])] = val;
      } else if (f === "ui") { u.monthlyInput = val; }
      saveOverrides(); updateCostsOnly();
    });
  });
  document.querySelectorAll("button[data-reset]").forEach(b => {
    b.addEventListener("click", () => { delete overrides[b.dataset.reset]; saveOverrides(); renderCards(); });
  });
}

function highlightCard(id) {
  document.querySelectorAll(".card").forEach(c=>c.classList.toggle("highlight", c.dataset.id===id));
}

let lbImages = [], lbIdx = 0;
const lb = document.getElementById("lightbox");
const lbImg = document.getElementById("lbImg");
const lbCap = document.getElementById("lbCap");
function openLightbox(officeId, idx) {
  const o = offices.find(x=>x.id===officeId);
  if (!o || !o.images || !o.images.length) return;
  lbImages = o.images; lbIdx = idx;
  showLb(); lb.classList.add("open");
}
function showLb() {
  const im = lbImages[lbIdx];
  lbImg.src = im.src; lbImg.alt = im.caption;
  lbCap.textContent = `${im.caption}  (${lbIdx+1}/${lbImages.length})`;
}
function lbMove(d) { if (!lbImages.length) return; lbIdx = (lbIdx + d + lbImages.length) % lbImages.length; showLb(); }
function lbCloseFn() { lb.classList.remove("open"); }
document.getElementById("lbClose").addEventListener("click", lbCloseFn);
document.getElementById("lbPrev").addEventListener("click", (e)=>{e.stopPropagation(); lbMove(-1);});
document.getElementById("lbNext").addEventListener("click", (e)=>{e.stopPropagation(); lbMove(1);});
lb.addEventListener("click", (e)=>{ if (e.target === lb) lbCloseFn(); });
document.addEventListener("keydown", (e)=>{
  if (!lb.classList.contains("open")) return;
  if (e.key === "Escape") lbCloseFn();
  else if (e.key === "ArrowLeft") lbMove(-1);
  else if (e.key === "ArrowRight") lbMove(1);
});
let touchX = null;
lb.addEventListener("touchstart", (e)=>{ touchX = e.changedTouches[0].clientX; });
lb.addEventListener("touchend", (e)=>{
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 45) lbMove(dx < 0 ? 1 : -1);
  touchX = null;
});

const TILES = {
  light: "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

function initMap() {
  map = L.map("map", { scrollWheelZoom:false, zoomControl:true, attributionControl:false });
  const theme = document.documentElement.getAttribute("data-theme");
  baseTile = L.tileLayer(theme==="dark"?TILES.dark:TILES.light, { maxZoom: 19, subdomains:"abc" }).addTo(map);
  const pts = [];
  offices.forEach((o,i) => {
    const mk = L.circleMarker([o.lat,o.lng], {
      radius: 9, color: "#fff", weight: 2, fillColor: "#2563eb", fillOpacity: 1
    }).addTo(map);
    mk.bindTooltip(o.short, { permanent:false, direction:"top" });
    mk.bindPopup(`<b>${o.name}</b>`);
    mk.on("click", ()=> { highlightCard(o.id); document.getElementById("card-"+o.id).scrollIntoView({behavior:"smooth",block:"center"}); });
    markers[o.id] = mk; pts.push([o.lat,o.lng]);
  });
  map.fitBounds(pts, { padding:[45,45] });
}
function refreshMapTiles() {
  if (!map) return;
  const theme = document.documentElement.getAttribute("data-theme");
  baseTile.setUrl(theme==="dark"?TILES.dark:TILES.light);
}

document.getElementById("monthsSlider").addEventListener("input", (e) => {
  months = parseInt(e.target.value);
  document.getElementById("monthsLabel").textContent = months + "개월";
  updateCostsOnly();
});

const themeBtn = document.getElementById("themeBtn");
function setTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  themeBtn.textContent = t==="dark" ? "☀️ 라이트" : "🌙 다크";
  try { localStorage.setItem("bucheon_theme", t); } catch(e){}
  refreshMapTiles();
}
themeBtn.addEventListener("click", () => {
  setTheme(document.documentElement.getAttribute("data-theme")==="dark" ? "light" : "dark");
});
(function(){
  let saved = "light";
  try { saved = localStorage.getItem("bucheon_theme") || (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"); } catch(e){}
  document.documentElement.setAttribute("data-theme", saved);
  themeBtn.textContent = saved==="dark" ? "☀️ 라이트" : "🌙 다크";
})();
